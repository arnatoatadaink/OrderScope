name = "orderscope-market-worker"
main = "src/index.ts"
compatibility_date = "2026-08-29"

[triggers]
crons = ["* * * * *"]

[vars]
WORKER_MODE = "shadow"
MARKET_TIMEZONE = "America/New_York"
DISPLAY_TIMEZONE = "Asia/Tokyo"
ALPACA_FEED = "iex"

# Production bindings are deliberately added only after the resources exist.
# Recommended v0.1 split:
# - D1: checkpoints, operational state, latest digest
# - R2: immutable/batched OHLCV archive and later bulk-analysis handoff
#
# [[d1_databases]]
# binding = "STATE_DB"
# database_name = "orderscope-state"
# database_id = "<set-after-create>"
#
# [[r2_buckets]]
# binding = "BAR_ARCHIVE"
# bucket_name = "orderscope-bars"
