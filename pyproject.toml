[project]
name = "orderscope-local"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "pyarrow>=21,<22",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["analysis/app"]
testpaths = ["analysis/tests"]
