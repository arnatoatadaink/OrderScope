name: REL-09 v0.1.9 validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconstructed v0.1.9 candidate
        uses: actions/checkout@v4
        with:
          ref: 530ae9087c53ced5f1c8261cf32d1e7687334943
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Python dependencies
        run: uv sync
      - name: Install Node dependencies
        run: npm ci
      - name: Volatility focused tests
        run: |
          uv run pytest -q \
            analysis/tests/contracts/test_volatility_benchmark.py \
            analysis/tests/cross_market/test_volatility_term_structure.py \
            analysis/tests/cross_market/test_volatility_etp_roll.py \
            analysis/tests/cross_market/test_vix_interpretation.py \
            analysis/tests/cross_market/test_btc_iv30.py \
            analysis/tests/cross_market/test_mstr_iv30.py \
            analysis/tests/cross_market/test_mstr_btc_iv30.py \
            analysis/tests/cross_market/test_volatility_calibration.py
      - name: Full Python regression
        run: uv run pytest -q analysis/tests
      - name: Python compileall
        run: uv run python -m compileall -q analysis/app
      - name: Worker tests
        run: npm test
      - name: Worker typecheck
        run: npm run typecheck
      - name: Diff check
        run: git diff --check
